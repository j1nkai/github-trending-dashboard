<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Daily Trending Top 15</title>
  <!-- Tailwind CSS CDN (v4 Alpha/Beta or Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #FAFAFA;
      color: #171717;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>
<body className="min-h-screen p-6 md:p-12">
  <div class="min-h-screen max-w-5xl mx-auto py-6 md:py-12 px-4 selection:bg-[#E5E5E5]">
    <!-- Header -->
    <header class="border-b border-[#E5E5E5] pb-6 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="flex items-center gap-2 text-xs text-[#737373] mb-1">
          <i data-lucide="terminal" class="w-4 h-4"></i>
          <span>JAPANESE CYBER-CORE / PAPER PRINT EDITION</span>
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-[#0A0A0A]">
          GitHub Daily Trending Top 15
        </h1>
      </div>
      <div class="text-xs text-[#737373] bg-[#F5F5F5] border border-[#E5E5E5] px-3 py-1.5 rounded-sm">
        STATUS: <span class="text-[#16A34A] font-bold">ONLINE</span> | HTML5 + TAILWIND
      </div>
    </header>

    <!-- Main Content -->
    <main class="space-y-6">
      <!-- Search Bar -->
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#A3A3A3]"></i>
        <input
          type="text"
          id="searchInput"
          placeholder="搜索开源项目、语言、架构标签或关键词..."
          class="w-full bg-white border border-[#E5E5E5] pl-9 pr-4 py-2 text-sm text-[#171717] placeholder-[#A3A3A3] focus:outline-none focus:border-[#0A0A0A] rounded-sm transition-colors"
        />
      </div>

      <!-- Repository Grid -->
      <div id="repoList" class="grid grid-cols-1 gap-4">
        <!-- Dynamic Content Loaded by JS -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 pt-6 border-t border-[#E5E5E5] text-xs text-[#A3A3A3] flex justify-between items-center">
      <span>Powered by HTML5 & Tailwind CSS | OpenClaw Architecture</span>
      <span>Paper-texture Cyber-Core Aesthetic</span>
    </footer>
  </div>

  <script>
    let allRepos = [];

    // 获取并渲染数据
    async function init() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/j1nkai/github-trending-dashboard/main/data/github-trending-top15.json');
        allRepos = await response.json();
        render(allRepos);
      } catch (err) {
        console.error('Failed to load trending data:', err);
      }
    }

    function render(repos) {
      const listEl = document.getElementById('repoList');
      listEl.innerHTML = '';

      if (repos.length === 0) {
        listEl.innerHTML = `<div class="text-center py-12 text-[#737373] text-sm border border-dashed border-[#E5E5E5]">没有找到匹配的项目</div>`;
        return;
      }

      repos.forEach(repo => {
        const rankStr = repo.rank < 10 ? `0${repo.rank}` : repo.rank;
        const starCount = repo.stars ? repo.stars.toLocaleString() : '0';
        const forkCount = repo.forks ? repo.forks.toLocaleString() : '0';
        const tag = repo.review?.tag || repo.language || '未知';

        // 生成 AI 洞察分析区块 HTML
        let reviewHtml = '';
        if (repo.review) {
          reviewHtml = `
            <div class="mt-4 p-4 bg-[#FAFAFA] border border-[#E5E5E5] rounded-sm text-xs space-y-2 text-[#404040]">
              <div class="mb-2">
                <span class="font-bold text-[#0A0A0A]">【业务痛点与背景】</span>
                <p class="mt-0.5 text-[#525252]">${repo.review.bg}</p>
              </div>
              <div class="mb-2">
                <span class="font-bold text-[#0A0A0A]">【核心功能】</span>
                <p class="mt-0.5 text-[#525252]">${repo.review.func}</p>
              </div>
              <div class="mb-2">
                <span class="font-bold text-[#0A0A0A]">【技术亮点】</span>
                <p class="mt-0.5 whitespace-pre-line text-[#525252]">${repo.review.tech}</p>
              </div>
              <div>
                <span class="font-bold text-[#0A0A0A]">【适用场景】</span>
                <p class="mt-0.5 text-[#525252]">${repo.review.scene}</p>
              </div>
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = "bg-white border border-[#E5E5E5] hover:border-[#0A0A0A] p-6 rounded-sm transition-all shadow-sm hover:shadow-none relative group";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <div class="flex items-start gap-4 w-full">
              <span class="text-xl font-bold text-[#A3A3A3] w-8">${rankStr}</span>
              <div class="w-full">
                <div class="flex items-center justify-between flex-wrap gap-2">
                  <a
                    href="${repo.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="font-bold text-lg text-[#0A0A0A] hover:underline flex items-center gap-1.5"
                  >
                    ${repo.name}
                    <i data-lucide="arrow-up-right" class="w-4 h-4 text-[#737373] group-hover:text-[#0A0A0A] transition-colors"></i>
                  </a>
                  <span class="text-xs bg-[#F5F5F5] border border-[#E5E5E5] text-[#525252] px-2 py-0.5 rounded-sm">
                    ${tag}
                  </span>
                </div>

                <p class="text-sm text-[#525252] mt-2 leading-relaxed">
                  ${repo.description || '无描述'}
                </p>

                ${reviewHtml}
              </div>
            </div>
          </div>

          <!-- Footer Meta -->
          <div class="flex flex-wrap items-center gap-4 mt-4 pt-3 border-t border-[#F5F5F5] text-xs text-[#737373]">
            <span class="flex items-center gap-1 bg-[#F5F5F5] px-2 py-0.5 rounded-sm">
              <span class="w-2 h-2 rounded-full bg-[#2563EB] inline-block"></span>
              ${repo.language || '未知'}
            </span>
            <span class="flex items-center gap-1">
              <i data-lucide="star" class="w-3.5 h-3.5 text-[#D97706]"></i>
              ${starCount}
            </span>
            <span class="flex items-center gap-1">
              <i data-lucide="git-fork" class="w-3.5 h-3.5"></i>
              ${forkCount}
            </span>
          </div>
        `;
        listEl.appendChild(card);
      });

      // 渲染新加入的 Lucide 图标
      lucide.createIcons();
    }

    // 搜索过滤逻辑
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const filter = e.target.value.toLowerCase();
      const filtered = allRepos.filter(repo => 
        repo.name.toLowerCase().includes(filter) ||
        (repo.description && repo.description.toLowerCase().includes(filter)) ||
        (repo.language && repo.language.toLowerCase().includes(filter)) ||
        (repo.review && repo.review.tag.toLowerCase().includes(filter))
      );
      render(filtered);
    });

    init();
  </script>
</body>
</html>
